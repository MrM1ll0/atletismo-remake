<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Atletismo · 100 metros lisos</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html,body{margin:0;height:100%;background:#05070f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#12183a,#03040a)}
  canvas{display:block;image-rendering:auto;outline:none;touch-action:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<script>
'use strict';
/* =====================================================================
   ATLETISMO · 100 METROS LISOS  — prototipo jugable (HTML + canvas + WebAudio)
   Todo el arte y el sonido se generan por código. Sin assets externos.
   ===================================================================== */
const W = 1280, H = 720;
const PPM = 64;                       // píxeles por metro
let FINISH = 100;                     // metros (cambia según la prueba)
const TRACK_TOP = 428, LANE_H = 58, TRACK_BOT = TRACK_TOP + LANE_H * 4;
const LY = [0, 1, 2, 3].map(i => TRACK_TOP + LANE_H * i + 29);   // y de los pies por calle
const LS = [0.86, 0.91, 0.955, 1.0];  // escala por calle (perspectiva)
const SHEAR = 0.35;                   // proyección oblicua: líneas transversales inclinadas
const BASE_Y = LY[3];
const CHEST = 18;                     // desfase cadera→pecho (px)
const PLAYER_LANE = 3;
const FONT = 'system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let viewScale = 1, TS = 1;

/* ---------- utilidades ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex2rgb(h) { h = h.replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }
function rgb2hex(c) { return '#' + c.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const x = hex2rgb(a), y = hex2rgb(b); return rgb2hex([lerp(x[0], y[0], t), lerp(x[1], y[1], t), lerp(x[2], y[2], t)]); }
const shade = (c, t) => mix(c, '#000000', t);
const tint = (c, t) => mix(c, '#ffffff', t);
function fmtTime(t) { if (!isFinite(t)) return '--.--'; const c = Math.floor(t * 100 + 1e-6); const s = Math.floor(c / 100), cs = c % 100; return String(s).padStart(2, '0') + '.' + String(cs).padStart(2, '0'); }

/* =====================================================================
   CAPAS PRE-RENDERIZADAS (cielo, gradas, vallas, pista…)
   ===================================================================== */
const L = {};
function tile(w, h, fn) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * TS); c.height = Math.ceil(h * TS);
  const g = c.getContext('2d'); g.scale(TS, TS); fn(g, w, h);
  c.lw = w; c.lh = h; return c;
}
function glow(g, x, y, r, color, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, color.replace('A', a)); gr.addColorStop(1, color.replace('A', 0));
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
const CROWD_SKIN = ['#f1c9a5', '#d9a47a', '#b97c55', '#8d5a3b', '#f6d8bd', '#6d4630'];
const CROWD_SHIRT = ['#e63946', '#f1faee', '#ffd166', '#06d6a0', '#118ab2', '#ef476f', '#f78c6b', '#8338ec', '#ffffff', '#3a86ff', '#fb5607', '#2b2d42'];
function crowdTile(w, h, rows, rowStep, headR, variant, seed, dim) {
  return tile(w, h, (g) => {
    const bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#171c45'); bg.addColorStop(1, '#2a2f60');
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    const rnd = mulberry(seed);
    for (let r = 0; r < rows; r++) {
      const y0 = 8 + r * rowStep;
      const spacing = headR * 2.5;
      const n = Math.ceil(w / spacing);
      for (let i = 0; i < n; i++) {
        const x = i * spacing + (r % 2) * spacing * 0.5 + (rnd() - 0.5) * 3;
        const skin = CROWD_SKIN[Math.floor(rnd() * CROWD_SKIN.length)];
        const shirt = CROWD_SHIRT[Math.floor(rnd() * CROWD_SHIRT.length)];
        const hair = ['#1b1210', '#3b2314', '#caa45a', '#8a8a8a', '#a33a20'][Math.floor(rnd() * 5)];
        const up = rnd() < 0.22, ph = rnd();
        const bob = ((variant + (ph > 0.5 ? 1 : 0)) % 2 ? -1.6 : 0.8) * (headR / 5);
        const y = y0 + bob;
        g.fillStyle = shade(shirt, 0.15); g.beginPath();
        g.ellipse(x, y + headR * 2.1, headR * 1.25, headR * 1.5, 0, 0, Math.PI * 2); g.fill();
        if (up && (variant + (ph > 0.5 ? 1 : 0)) % 2 === 0) {
          g.strokeStyle = skin; g.lineWidth = headR * 0.55; g.lineCap = 'round';
          g.beginPath(); g.moveTo(x - headR, y + headR * 1.6); g.lineTo(x - headR * 1.5, y - headR * 1.0); g.moveTo(x + headR, y + headR * 1.6); g.lineTo(x + headR * 1.5, y - headR * 1.2); g.stroke();
        }
        g.fillStyle = skin; g.beginPath(); g.arc(x, y, headR, 0, Math.PI * 2); g.fill();
        g.fillStyle = hair; g.beginPath(); g.arc(x, y - headR * 0.15, headR * 1.02, Math.PI * 1.05, Math.PI * 1.98); g.fill();
        if (rnd() < 0.05) {
          const fc = CROWD_SHIRT[Math.floor(rnd() * CROWD_SHIRT.length)];
          g.strokeStyle = '#ddd'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(x + headR, y + headR); g.lineTo(x + headR, y - headR * 3); g.stroke();
          g.fillStyle = fc; g.beginPath(); g.moveTo(x + headR, y - headR * 3); g.lineTo(x + headR * 4, y - headR * 2.3 + (variant ? 1 : -1)); g.lineTo(x + headR, y - headR * 1.4); g.fill();
        }
      }
      g.fillStyle = 'rgba(8,10,30,0.28)'; g.fillRect(0, y0 + rowStep * 0.6, w, rowStep * 0.4);
    }
    g.fillStyle = 'rgba(16,20,60,' + dim + ')'; g.fillRect(0, 0, w, h);
    const lit = g.createLinearGradient(0, 0, 0, h);
    lit.addColorStop(0, 'rgba(255,225,170,0.10)'); lit.addColorStop(1, 'rgba(255,190,120,0.0)');
    g.fillStyle = lit; g.fillRect(0, 0, w, h);
  });
}
function buildLayers() {
  L.sky = tile(W, 420, (g) => {
    const s = g.createLinearGradient(0, 0, 0, 420);
    s.addColorStop(0, '#071033'); s.addColorStop(0.35, '#1e2f7a'); s.addColorStop(0.62, '#7a4f9c'); s.addColorStop(0.82, '#e9756b'); s.addColorStop(1, '#ffc27a');
    g.fillStyle = s; g.fillRect(0, 0, W, 420);
    const rnd = mulberry(7);
    for (let i = 0; i < 70; i++) { g.fillStyle = 'rgba(255,255,255,' + (rnd() * 0.5) + ')'; g.fillRect(rnd() * W, rnd() * 130, 1.4, 1.4); }
    glow(g, 880, 330, 340, 'rgba(255,190,120,A)', 0.55);
  });
  L.clouds = tile(2048, 240, (g) => {
    const rnd = mulberry(21);
    for (let i = 0; i < 16; i++) {
      const x = rnd() * 2048, y = 40 + rnd() * 160, w = 140 + rnd() * 240;
      for (let k = 0; k < 6; k++) {
        const cx = x + (rnd() - 0.5) * w, cy = y + (rnd() - 0.5) * 18, r = w * (0.25 + rnd() * 0.25);
        const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r);
        gr.addColorStop(0, 'rgba(255,196,170,0.22)'); gr.addColorStop(1, 'rgba(255,196,170,0)');
        g.save(); g.translate(cx, cy); g.scale(1, 0.22); g.translate(-cx, -cy); g.fillStyle = gr; g.fillRect(cx - r, cy - r, r * 2, r * 2); g.restore();
      }
    }
  });
  L.hills = tile(1600, 120, (g) => {
    const rnd = mulberry(55);
    g.fillStyle = '#141a45'; g.beginPath(); g.moveTo(0, 120);
    for (let x = 0; x <= 1600; x += 20) g.lineTo(x, 70 + Math.sin(x * 0.006) * 22 + Math.sin(x * 0.017 + 1) * 10 + (rnd() - 0.5) * 3);
    g.lineTo(1600, 120); g.fill();
    g.fillStyle = '#0d1236';
    for (let i = 0; i < 70; i++) { const x = rnd() * 1600, h = 14 + rnd() * 20; g.beginPath(); g.moveTo(x - 7, 120); g.quadraticCurveTo(x - 9, 120 - h * 0.7, x, 120 - h - 24); g.quadraticCurveTo(x + 9, 120 - h * 0.7, x + 7, 120); g.fill(); }
    for (let i = 0; i < 40; i++) { g.fillStyle = 'rgba(255,214,140,' + (0.3 + rnd() * 0.5) + ')'; g.fillRect(rnd() * 1600, 80 + rnd() * 35, 2, 2); }
  });
  L.towers = tile(1600, 330, (g) => {
    [300, 1100].forEach((x) => {
      g.save(); g.globalCompositeOperation = 'lighter';
      [[-330, -120], [-90, 120]].forEach(([l, r]) => {
        const bg = g.createLinearGradient(x, 70, x, 330); bg.addColorStop(0, 'rgba(255,236,190,0.16)'); bg.addColorStop(1, 'rgba(255,236,190,0)');
        g.fillStyle = bg; g.beginPath(); g.moveTo(x - 30, 70); g.lineTo(x + 30, 70); g.lineTo(x + r + 120, 330); g.lineTo(x + l + 120, 330); g.fill();
      });
      g.restore();
      const gr = g.createLinearGradient(x - 5, 0, x + 5, 0);
      gr.addColorStop(0, '#0e1230'); gr.addColorStop(1, '#2b3166');
      g.fillStyle = gr; g.fillRect(x - 6, 70, 12, 260);
      g.strokeStyle = 'rgba(120,130,200,0.35)'; g.lineWidth = 1;
      for (let y = 80; y < 320; y += 24) { g.beginPath(); g.moveTo(x - 6, y); g.lineTo(x + 6, y + 24); g.moveTo(x + 6, y); g.lineTo(x - 6, y + 24); g.stroke(); }
      g.fillStyle = '#10143a'; g.fillRect(x - 55, 28, 110, 62);
      g.fillStyle = '#242a5c'; g.fillRect(x - 55, 28, 110, 4);
      for (let r = 0; r < 3; r++) for (let c = 0; c < 6; c++) {
        g.fillStyle = '#fff6dd'; g.beginPath(); g.arc(x - 44 + c * 17.6, 42 + r * 18, 5.4, 0, 7); g.fill();
      }
      glow(g, x, 62, 190, 'rgba(255,236,190,A)', 0.55);
      glow(g, x, 62, 70, 'rgba(255,255,255,A)', 0.7);
      g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = 'rgba(255,240,210,0.55)'; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(x - 120, 62); g.lineTo(x + 120, 62); g.moveTo(x, -10); g.lineTo(x, 140); g.stroke();
      g.strokeStyle = 'rgba(255,240,210,0.25)'; g.beginPath(); g.moveTo(x - 70, 20); g.lineTo(x + 70, 104); g.moveTo(x + 70, 20); g.lineTo(x - 70, 104); g.stroke(); g.restore();
    });
  });
  L.upper = [0, 1].map(v => crowdTile(1280, 150, 10, 12, 4.4, v, 11, 0.42));
  L.canopy = tile(1280, 52, (g) => {
    const gr = g.createLinearGradient(0, 22, 0, 52); gr.addColorStop(0, '#0a0d26'); gr.addColorStop(1, '#232958');
    g.fillStyle = gr; g.fillRect(0, 22, 1280, 30);
    g.strokeStyle = '#3a4380'; g.lineWidth = 2;
    for (let x = 0; x < 1280; x += 64) { g.beginPath(); g.moveTo(x, 22); g.lineTo(x + 32, 50); g.lineTo(x + 64, 22); g.stroke(); }
    g.fillStyle = '#4b559a'; g.fillRect(0, 21, 1280, 3);
    g.fillStyle = 'rgba(255,255,255,0.14)'; g.fillRect(0, 21, 1280, 1);
    for (let x = 32; x < 1280; x += 64) { g.fillStyle = '#ffe2a8'; g.beginPath(); g.arc(x, 49, 2.8, 0, 7); g.fill(); glow(g, x, 50, 26, 'rgba(255,220,160,A)', 0.55); }
    const fc = ['#d62839', '#ffd23f', '#17a34a', '#2d6bff', '#ffffff'];
    for (let i = 0; i < 20; i++) {
      const x = 30 + i * 64;
      g.strokeStyle = '#8b92c6'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, 22); g.lineTo(x, 2); g.stroke();
      g.fillStyle = fc[i % 5]; g.beginPath(); g.moveTo(x, 3); g.quadraticCurveTo(x + 14, 2, x + 26, 8); g.quadraticCurveTo(x + 14, 10, x, 14); g.fill();
    }
  });
  L.bunting = tile(1024, 44, (g) => {
    const cols = ['#ff4d6d', '#ffd166', '#06d6a0', '#4cc9f0', '#ffffff', '#f78c6b'];
    for (let seg = 0; seg < 8; seg++) {
      const x0 = seg * 128, x1 = x0 + 128;
      g.strokeStyle = 'rgba(230,230,255,0.6)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(x0, 4); g.quadraticCurveTo((x0 + x1) / 2, 26, x1, 4); g.stroke();
      for (let i = 1; i < 9; i++) {
        const t = i / 9, px = lerp(x0, x1, t), py = (1 - t) * (1 - t) * 4 + 2 * (1 - t) * t * 26 + t * t * 4;
        g.fillStyle = cols[(i + seg) % cols.length]; g.beginPath(); g.moveTo(px - 6, py); g.lineTo(px + 6, py); g.lineTo(px, py + 13); g.closePath(); g.fill();
        g.fillStyle = 'rgba(255,255,255,0.25)'; g.beginPath(); g.moveTo(px - 6, py); g.lineTo(px, py); g.lineTo(px, py + 13); g.closePath(); g.fill();
      }
    }
  });
  L.lower = [0, 1].map(v => tile(1024, 104, (g) => {
    const c = crowdTile(1024, 104, 7, 13, 6.2, v, 5, 0.12);
    g.drawImage(c, 0, 0, 1024, 104);
    const r = g.createLinearGradient(0, 0, 0, 8); r.addColorStop(0, '#454c86'); r.addColorStop(1, '#202658');
    g.fillStyle = r; g.fillRect(0, 0, 1024, 8);
  }));
  L.wall = tile(1200, 70, (g) => {
    const boards = [['#e8452c', 'ATLETISMO'], ['#1e7fd8', 'VELOZ SPORT'], ['#f2b01e', 'TURBO'], ['#14a06b', 'NOVA ENERGÍA'], ['#7a3fd1', 'ARCO SEGUROS']];
    boards.forEach((b, i) => {
      const x = i * 240;
      const gr = g.createLinearGradient(0, 0, 0, 70);
      gr.addColorStop(0, tint(b[0], 0.28)); gr.addColorStop(0.5, b[0]); gr.addColorStop(1, shade(b[0], 0.45));
      g.fillStyle = gr; g.fillRect(x, 6, 236, 60);
      g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(x, 6, 236, 3);
      g.font = '900 italic 30px ' + FONT; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillText(b[1], x + 120, 40);
      g.fillStyle = '#fff'; g.fillText(b[1], x + 118, 38);
      g.fillStyle = '#10142e'; g.fillRect(x + 236, 6, 4, 60);
    });
    g.fillStyle = '#d9dcf0'; g.fillRect(0, 0, 1200, 6);
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(0, 62, 1200, 8);
  });
  L.track = tile(480, TRACK_BOT - TRACK_TOP, (g, w, h) => {
    const rnd = mulberry(99);
    for (let k = 0; k < 4; k++) {
      const y = k * LANE_H;
      const gr = g.createLinearGradient(0, y, 0, y + LANE_H);
      const dark = (3 - k) * 0.03;
      gr.addColorStop(0, shade('#c4503a', 0.14 + dark)); gr.addColorStop(0.5, shade('#d96a4c', dark)); gr.addColorStop(1, shade('#b2442f', 0.06 + dark));
      g.fillStyle = gr; g.fillRect(0, y, w, LANE_H);
    }
    // moteado de gran escala (periódico)
    for (let i = 0; i < 46; i++) {
      const x = rnd() * w, y = rnd() * h, r = 26 + rnd() * 70, light = rnd() < 0.5;
      for (const ox of [-w, 0, w]) {
        const gr = g.createRadialGradient(x + ox, y, 0, x + ox, y, r);
        gr.addColorStop(0, light ? 'rgba(255,170,130,0.06)' : 'rgba(60,10,10,0.07)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr; g.fillRect(x + ox - r, y - r, r * 2, r * 2);
      }
    }
    // grano de caucho (EPDM)
    for (let i = 0; i < 9000; i++) {
      const c = rnd(); g.fillStyle = c < 0.4 ? 'rgba(40,5,5,0.10)' : c < 0.75 ? 'rgba(255,190,150,0.09)' : 'rgba(150,30,20,0.12)';
      const sz = 0.8 + rnd() * 1.6; g.beginPath(); g.ellipse(rnd() * w, rnd() * h, sz, sz * 0.7, rnd() * 3, 0, 7); g.fill();
    }
    // huella de zapatillas: bandas desgastadas en el centro de cada calle
    for (let k = 0; k < 4; k++) {
      const y = k * LANE_H + LANE_H / 2, gr = g.createLinearGradient(0, y - 12, 0, y + 12);
      gr.addColorStop(0, 'rgba(60,10,5,0)'); gr.addColorStop(0.5, 'rgba(60,10,5,0.07)'); gr.addColorStop(1, 'rgba(60,10,5,0)');
      g.fillStyle = gr; g.fillRect(0, y - 12, w, 24);
    }
    for (let i = 0; i < 50; i++) { g.fillStyle = 'rgba(0,0,0,0.03)'; g.fillRect(rnd() * w, rnd() * h, 60 + rnd() * 200, 1); }
    // líneas de calle con bordes suaves
    for (let k = 0; k <= 4; k++) {
      const t = k === 0 || k === 4 ? 4 : 3, yy = k * LANE_H;
      g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect(0, yy - t / 2 - 1, w, t + 3);
      g.fillStyle = 'rgba(255,255,255,0.95)'; g.fillRect(0, yy - t / 2, w, t);
      g.fillStyle = 'rgba(255,255,255,0.4)'; g.fillRect(0, yy - t / 2 - 1, w, 1);
    }
    const sh = g.createLinearGradient(0, 0, 0, h); sh.addColorStop(0, 'rgba(0,0,30,0.34)'); sh.addColorStop(0.2, 'rgba(0,0,30,0)'); sh.addColorStop(1, 'rgba(0,0,20,0.12)'); g.fillStyle = sh; g.fillRect(0, 0, w, h);
  });
  L.grass = tile(400, 36, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#2f8f4a'); gr.addColorStop(1, '#14502a');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const rnd = mulberry(3);
    for (let i = 0; i < 260; i++) { g.strokeStyle = 'rgba(' + (rnd() < 0.5 ? '170,255,150' : '10,60,25') + ',0.22)'; g.lineWidth = 1; const x = rnd() * w, y = rnd() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - 0.5) * 3, y - 3 - rnd() * 4); g.stroke(); }
    g.fillStyle = '#e6e8f5'; g.fillRect(0, 0, w, 3);
  });
  L.vig = tile(W, H, (g) => {
    const v = g.createRadialGradient(W / 2, H * 0.48, H * 0.35, W / 2, H * 0.48, H * 1.0);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(2,3,14,0.62)');
    g.fillStyle = v; g.fillRect(0, 0, W, H);
  });
  L.pool = tile(600, 190, (g) => {
    g.save(); g.translate(300, 95); g.scale(1, 0.32);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, 300);
    gr.addColorStop(0, 'rgba(255,230,180,0.30)'); gr.addColorStop(1, 'rgba(255,230,180,0)');
    g.fillStyle = gr; g.fillRect(-300, -300, 600, 600); g.restore();
  });
  L.dust = tile(64, 64, (g) => {
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(236,200,160,0.95)'); gr.addColorStop(0.55, 'rgba(214,170,130,0.45)'); gr.addColorStop(1, 'rgba(200,150,110,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  });
  L.smoke = tile(64, 64, (g) => {
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(0.5, 'rgba(235,238,250,0.4)'); gr.addColorStop(1, 'rgba(235,238,250,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  });
  L.grassf = tile(480, TRACK_BOT - TRACK_TOP, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#2e7a3a'); gr.addColorStop(0.5, '#3b8f45'); gr.addColorStop(1, '#2f7d3c');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 80) { g.fillStyle = 'rgba(255,255,255,0.055)'; g.fillRect(x, 0, 40, h); }
    const rnd = mulberry(777);
    for (let i = 0; i < 900; i++) { g.fillStyle = rnd() < 0.5 ? 'rgba(210,255,190,0.16)' : 'rgba(0,40,10,0.18)'; g.fillRect(rnd() * w, rnd() * h, 1, 2 + rnd() * 3); }

function torsoPath(g, hip, sh) {

  const pt = (t, f) => [hip[0] + ux * ul * t + nx * f, hip[1] + uy * ul * t + ny * f];
  g.beginPath();
  let q = pt(-0.02, 10.5); g.moveTo(q[0], q[1]);
  q = pt(0.3, 10.6); g.quadraticCurveTo(...pt(0.15, 11), ...q);                 // vientre
  q = pt(0.72, 14.2); g.quadraticCurveTo(...pt(0.52, 11.2), ...q);              // pecho
  q = pt(1.02, 10.4); g.quadraticCurveTo(...pt(0.95, 14), ...q);                // clavícula
  q = pt(1.04, -7.5); g.quadraticCurveTo(...pt(1.07, 0), ...q);                 // trapecio
  q = pt(0.62, -12.6); g.quadraticCurveTo(...pt(0.9, -13.6), ...q);             // dorsales
  q = pt(0.28, -9.6); g.quadraticCurveTo(...pt(0.45, -9.4), ...q);              // lumbar
  q = pt(-0.04, -13.2); g.quadraticCurveTo(...pt(0.08, -13.4), ...q);           // glúteo
  g.closePath();
  return { ux, uy, nx, ny, ul, pt };
}

    ctx.fillStyle = '#1b3a8c'; rrect(bx - 66, gy - 2, 132, 18, 6); ctx.fill();

}

const KEYL = ['ArrowLeft', 'KeyA'], KEYR = ['ArrowRight', 'KeyD'];
window.addEventListener('keydown', e => {
  SFX.init();
  const c = e.code;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Enter', 'Escape'].includes(c)) e.preventDefault();
  if (c === 'KeyM') { if (!e.repeat) SFX.setMuted(!SFX.muted); return; }
  if (e.repeat) return;
  if (c === 'Escape') { escape(); return; }
  if (scene === 'title' || scene === 'select') {
    if (scene === 'select' && (c === 'ArrowUp' || c === 'KeyW')) menuMove(-4);
    else if (scene === 'select' && (c === 'ArrowDown' || c === 'KeyS')) menuMove(4);
    else if (c === 'ArrowUp' || c === 'KeyW' || KEYL.includes(c)) menuNav(0);
    else if (c === 'ArrowDown' || c === 'KeyS' || KEYR.includes(c)) menuNav(1);
    else if (c === 'Space' || c === 'Enter') action();
    return;
  }
  if (KEYL.includes(c)) { keyDown.L = true; onTap(0); }
  else if (KEYR.includes(c)) { keyDown.R = true; onTap(1); }
  else if (c === 'KeyP' || c === 'ArrowDown') passPress();
  else if (c === 'ArrowUp' || c === 'KeyW') { if (scene === 'play') { jumpFlash = 0.15; jumpPress(); } }
  else if (c === 'Space' || c === 'Enter') { if (scene === 'play' && state !== 'results' && state !== 'dq') jumpFlash = 0.15; action(); }
});
window.addEventListener('keyup', e => {
  if (KEYL.includes(e.code)) keyDown.L = false; else if (KEYR.includes(e.code)) keyDown.R = false;
});
window.addEventListener('blur', () => { keyDown.L = keyDown.R = false; });
canvas.addEventListener('pointerdown', e => {

  for (let i = uiRects.length - 1; i >= 0; i--) { const b = uiRects[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; } }

});

/* =====================================================================
   BUCLE PRINCIPAL (paso fijo 1/120 s)
   ===================================================================== */
const STEP = 1 / 120;
let acc = 0, last = performance.now(), fpsCount = 0, fpsT = 0, fps = 60;
function frame(now) {
  let dt = (now - last) / 1000; last = now; if (dt > 0.1) dt = 0.1;
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  fpsCount++; fpsT += dt; if (fpsT >= 1) { fps = fpsCount / fpsT; fpsCount = 0; fpsT = 0; }
  requestAnimationFrame(frame);
}
resize();
scene = 'title'; prepareIdle('100');
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

// ganchos para pruebas automáticas (no afectan al juego)
window.__atl = {
  get state() { return state; }, get scene() { return scene; }, get EV() { return EV; }, get fps() { return fps; }, get race() { return race; }, get player() { return player; },
  get runners() { return runners; }, get best() { return best; }, get lj() { return lj; }, get tour() { return tour; }, get results() { return results; }, get cam() { return cam; },
  set freeze(v) { FREEZE = v; }, setState(s) { state = s; }, snapCam() { cam = player.x * PPM - 460 + player.v * 10; }, startEvent, goTitle, goSelect, menu, action, jumpPress, escape, onTap, ljFinish, bests, HURDLES, BOARD, passPress, FIELD, EVENTS, get fe() { return fe; }, consts: () => ({ JV_LINE, JV_START, HJ_BAR, HJ_START, HJ_D, HJ_H, PV_IDEAL, PV_BOX, PV_H: typeof PV_H !== 'undefined' ? PV_H : null, HM_C }),
  simulate(rate, jitter, seed, ev, autoJump, jumpErr) {
    const rnd = mulberry(seed || 1);
    startEvent(ev || '100'); state = 'run'; race.t = 0; runners.forEach(r => r.k3 = 1);
    let nextTap = 0.2, side = 0, t = 0;
    while (t < EVENTS[EV].tmax + 5 && !runners.every(r => r.finished)) {
      while (t >= nextTap && rate > 0) { onTap(side); side ^= 1; nextTap += (1 / rate) * (1 + (rnd() - 0.5) * 2 * jitter); }
      if (autoJump && HURD && player.nh < HURDLES.length && HURDLES[player.nh] - player.x <= player.v * JDUR / 2 + (jumpErr || 0)) jumpHurdle(player);
      updateRace(STEP); t += STEP; if (state === 'results') break;
    }
    return runners.map(r => ({ n: r.name, t: +r.finishT.toFixed(2), rank: r.rank, hits: r.hits }));
  }
};
